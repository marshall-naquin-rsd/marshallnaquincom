<!-- @dsCard group="Components" viewport="700x300" name="Core — buttons, badges, cards" subtitle="Five button variants, role and state badges, three card tones" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:#FAFAF8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}</style>
</head><body>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px">
  <button class="btn-primary">FIND A MEETING</button>
  <button class="btn-secondary">FOR PROFESSIONALS</button>
  <button class="btn-sage">START A MEETING</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px">
  <button class="btn-outline">20 QUESTIONS</button>
  <span style="background:#2F4250;padding:6px;border-radius:8px;display:inline-flex"><button class="btn-outline btn-outline-dark">ON DEEP</button></span>
  <button class="btn-small">Open</button>
  <button class="btn-primary" disabled>DISABLED</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">
  <span class="badge-officer">Area Secretary</span>
  <span class="badge-gsr">GSR</span>
  <span class="badge-milestone">5 years</span>
  <span class="badge-info">Open meeting</span>
  <span class="badge-success">Confirmed</span>
  <span class="badge-warning">Pending</span>
  <span class="badge-danger">Closed</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
  <div class="card"><div style="font-family:'League Spartan';font-weight:700;color:#2F4250;font-size:18px">Record</div><div style="font-size:14px;color:#5E6B72;margin-top:6px">Default hairline card.</div></div>
  <div class="card card-milestone"><div style="font-family:'League Spartan';font-weight:700;color:#2F4250;font-size:18px">Confirmed</div><div style="font-size:14px;color:#5E6B72;margin-top:6px">Brass top rule.</div></div>
  <div class="card card-sage"><div style="font-family:'League Spartan';font-weight:700;color:#2F4250;font-size:18px">Advisory</div><div style="font-size:14px;color:#4A5A46;margin-top:6px">Sage panel.</div></div>
</div>
</body></html>
