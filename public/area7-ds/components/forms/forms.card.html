<!-- @dsCard group="Components" viewport="700x320" name="Forms — field, select, textarea, checks" subtitle="Labelled controls with heron focus ring, error and disabled states" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:#FAFAF8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}</style>
</head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div>
    <label class="form-label" for="c">City</label>
    <input class="form-input" id="c" placeholder="Hammond">
  </div>
  <div>
    <label class="form-label" for="s">State</label>
    <select class="form-select" id="s"><option>Louisiana</option><option>Mississippi</option><option>Southern Alabama</option></select>
  </div>
  <div>
    <label class="form-label" for="e">Email</label>
    <input class="form-input" id="e" value="not-an-email" style="border-color:#9B4A3F">
    <span class="form-error">Enter an address the area can reply to.</span>
  </div>
  <div>
    <label class="form-label" for="d">Disabled</label>
    <input class="form-input" id="d" value="Locked" disabled>
  </div>
</div>
<div style="margin-top:14px">
  <label class="form-label" for="n">What should we correct?</label>
  <textarea class="form-textarea" id="n" style="min-height:70px" placeholder="Which meeting, and what changed?"></textarea>
</div>
<div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:6px">
  <label class="form-check-label"><input type="checkbox" checked> Open meetings only</label>
  <label class="form-check-label"><input type="radio" name="fmt" checked> In person</label>
  <label class="form-check-label"><input type="radio" name="fmt"> Hybrid</label>
</div>
</body></html>
